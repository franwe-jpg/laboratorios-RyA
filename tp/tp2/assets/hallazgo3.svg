<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Croquis — Hallazgo 3: puesto de control sin supervisión</text>

  <rect x="40" y="60" width="560" height="320" fill="#f5f5f5" stroke="#999" stroke-width="2"/>

  <!-- reception desk -->
  <rect x="200" y="230" width="240" height="60" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <text x="320" y="265" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Puesto de recepción</text>

  <!-- empty chair (outline only) -->
  <g stroke="#999" stroke-width="3" fill="none">
    <rect x="300" y="180" width="40" height="45" rx="4"/>
    <line x1="305" y1="225" x2="305" y2="245"/>
    <line x1="335" y1="225" x2="335" y2="245"/>
  </g>
  <text x="320" y="200" font-family="Arial" font-size="30" text-anchor="middle" fill="#bbb">?</text>
  <text x="320" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">Puesto vacío</text>

  <!-- door with people icons passing unchecked -->
  <rect x="60" y="150" width="20" height="140" fill="#8f8f8f"/>
  <text x="70" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Entrada</text>
  <g fill="#8fa8c9">
    <circle cx="120" cy="170" r="10"/><rect x="112" y="180" width="16" height="26" rx="4"/>
  </g>
  <path d="M135 185 L 190 210" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="320" y="405" font-family="Arial" font-size="13" text-anchor="middle" fill="#555">Sin cámaras instaladas: cuando el recepcionista se ausenta, no queda ningún registro de quién ingresa.</text>
</svg>
