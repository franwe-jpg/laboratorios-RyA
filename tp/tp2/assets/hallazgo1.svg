<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Croquis — Hallazgo 1: gabinete del servidor sin llave</text>

  <!-- room floor/wall -->
  <rect x="40" y="60" width="560" height="320" fill="#f5f5f5" stroke="#999" stroke-width="2"/>

  <!-- cabinet body (fixed frame) -->
  <rect x="120" y="110" width="180" height="220" fill="#d9d9d9" stroke="#333" stroke-width="3"/>
  <text x="210" y="100" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Gabinete (rack)</text>

  <!-- server unit inside -->
  <rect x="140" y="140" width="140" height="40" fill="#8fa8c9" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">Servidor</text>
  <rect x="140" y="190" width="140" height="20" fill="#b3b3b3" stroke="#333" stroke-width="1"/>
  <rect x="140" y="215" width="140" height="20" fill="#b3b3b3" stroke="#333" stroke-width="1"/>

  <!-- open door, swung out, dashed to show it's ajar -->
  <line x1="300" y1="110" x2="380" y2="150" stroke="#333" stroke-width="4"/>
  <rect x="296" y="106" width="10" height="228" fill="#333"/>
  <line x1="300" y1="110" x2="380" y2="150" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- missing lock icon: padlock with an X -->
  <circle cx="440" cy="220" r="46" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(415,195)">
    <rect x="8" y="20" width="34" height="26" rx="4" fill="none" stroke="#c0392b" stroke-width="3"/>
    <path d="M14 20 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="#c0392b" stroke-width="3"/>
  </g>
  <line x1="405" y1="185" x2="475" y2="255" stroke="#c0392b" stroke-width="5"/>
  <line x1="475" y1="185" x2="405" y2="255" stroke="#c0392b" stroke-width="5"/>
  <text x="440" y="290" font-family="Arial" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">sin candado</text>

  <text x="320" y="405" font-family="Arial" font-size="13" text-anchor="middle" fill="#555">La compuerta del gabinete permanece abierta; no se usa llave ni candado.</text>
</svg>
